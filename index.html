<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Foxysprolt">
    <link rel="stylesheet" href="styles.css">
    <title>O Chamado — Suporte Power2Go</title>
</head>
<body>

<main class="chat-container">

    <header class="chat-header">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            <div class="brand-text">
                <h1>O <span>Chamado</span></h1>
                <p>Suporte técnico Power2Go</p>
            </div>
        </div>
        <span class="status-dot" title="Sistema online"></span>
    </header>

    <section class="chat-box" id="chat"></section>

    <div class="input-area">
        <textarea class="caixa-texto" placeholder="Descreva o problema do carregador..." rows="2"></textarea>
        <button class="botao-ajuda" aria-label="Enviar mensagem">Enviar</button>
    </div>

</main>

<script type="module" src="script.js"></script>
</body>
</html>
